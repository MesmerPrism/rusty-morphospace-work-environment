name: validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Ensure ripgrep
        shell: pwsh
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            choco install ripgrep -y --no-progress
          }
      - name: Quick portable validation
        shell: pwsh
        run: |
          ./scripts/Test-PowerShellHost.ps1 -SelfTest
          ./scripts/Test-WorkEnvironment.ps1 -SelfTest -Tier Quick
          git diff --check

  quick-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Ensure ripgrep
        shell: pwsh
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            sudo apt-get update
            sudo apt-get install -y ripgrep
          }
      - name: Quick portable validation
        shell: pwsh
        run: |
          ./scripts/Test-PowerShellHost.ps1 -SelfTest
          ./scripts/Test-WorkEnvironment.ps1 -SelfTest -Tier Quick
          git diff --check

  standard-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Ensure ripgrep
        shell: pwsh
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            choco install ripgrep -y --no-progress
          }
      - name: Standard portable validation delta
        shell: pwsh
        run: |
          ./scripts/Test-WorkUnitAutomation.ps1

  deep:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Ensure ripgrep
        shell: pwsh
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            choco install ripgrep -y --no-progress
          }
      - name: Deep authority validation
        shell: pwsh
        run: |
          ./scripts/Test-PowerShellHost.ps1
          ./scripts/Test-WorkEnvironment.ps1 -SelfTest -Tier Deep
