name: validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('validate-pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('validate-main-{0}', github.ref) || 'validate-deep-schedule-manual' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Classify pre-job infrastructure with one bounded retry
        id: classify
        shell: pwsh
        run: |
          try {
            ./scripts/Test-AffectedValidationInfrastructure.ps1 -Attempt 0 -OutPath "$env:RUNNER_TEMP/infrastructure.json"
            $result = Get-Content -LiteralPath "$env:RUNNER_TEMP/infrastructure.json" -Raw | ConvertFrom-Json
            if ($result.classification -ceq 'pending-infra') {
              Start-Sleep -Seconds 10
              ./scripts/Test-AffectedValidationInfrastructure.ps1 -Attempt 1 -OutPath "$env:RUNNER_TEMP/infrastructure-retry.json"
              $result = Get-Content -LiteralPath "$env:RUNNER_TEMP/infrastructure-retry.json" -Raw | ConvertFrom-Json
            }
            "classification=$($result.classification)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
            if ($result.classification -ceq 'pending-infra') { throw 'Infrastructure remains pending after its single bounded retry.' }
          } catch {
            $message=[string]$_.Exception.Message;if($message.Length-gt2048){$message=$message.Substring(0,2048)}
            $diagnostic=[pscustomobject][ordered]@{schema='rusty.morphospace.diagnostic.affected_validation_pre_evidence_failure.v1';authority='non-authoritative-terminal-diagnostic';phase='setup';result='infra-fail';failure=[pscustomobject][ordered]@{failure_kind='setup';exception_type=$_.Exception.GetType().FullName;exception_message=$message};claims=[pscustomobject][ordered]@{typed_aggregate_evidence_produced=$false;acceptance_authority=$false;publication_authority=$false}}
            [byte[]]$bytes=[Text.UTF8Encoding]::new($false).GetBytes(($diagnostic|ConvertTo-Json -Depth 6 -Compress)+"`n");if($bytes.Length-gt65536){throw 'Bounded setup diagnostic exceeded 65536 bytes.'};$stream=[IO.File]::Open("$env:RUNNER_TEMP/affected-setup-diagnostic.json",[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None);try{$stream.Write($bytes,0,$bytes.Length)}finally{$stream.Dispose()};'diagnostic_ready=true'|Add-Content -LiteralPath $env:GITHUB_OUTPUT
            throw
          }
      - name: Preserve bounded setup diagnostic
        if: always() && steps.classify.outputs.diagnostic_ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: affected-setup-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/affected-setup-diagnostic.json
          if-no-files-found: error
          retention-days: 7

  select:
    needs: infrastructure
    if: needs.infrastructure.outputs.classification == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      linux: ${{ steps.plan.outputs.linux }}
      windows: ${{ steps.plan.outputs.windows }}
      linux_matrix: ${{ steps.plan.outputs.linux_matrix }}
      windows_matrix: ${{ steps.plan.outputs.windows_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resolve exact affected-validation plan
        id: plan
        shell: pwsh
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          $planFailure=$null
          try {
          ./scripts/Test-PowerShellHost.ps1 -SelfTest
          $base = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { $env:PR_BASE } elseif ($env:GITHUB_EVENT_NAME -eq 'push') { $env:PUSH_BEFORE } else { (git rev-parse HEAD^).Trim() }
          $head = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { $env:PR_HEAD } else { $env:GITHUB_SHA }
          $tier = if ($env:GITHUB_EVENT_NAME -in @('schedule','workflow_dispatch')) { 'Deep' } else { 'Quick' }
          if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$' -or $head -notmatch '^[0-9a-f]{40}$') { throw 'Affected validation requires exact nonzero event base and head identities.' }
          git cat-file -e "$base^{commit}"; if ($LASTEXITCODE -ne 0) { throw 'Event base commit is unavailable.' }
          if ((git rev-parse HEAD) -cne $head) { throw 'Checkout does not equal the event head SHA.' }
          ./scripts/Resolve-AffectedValidation.ps1 -RepositoryRoot . -BaseCommit $base -HeadCommit $head -Tier $tier -OutPath "$env:RUNNER_TEMP/affected-plan.json"
          $plan = Get-Content -LiteralPath "$env:RUNNER_TEMP/affected-plan.json" -Raw | ConvertFrom-Json -Depth 64
          "plan_sha256=$($plan.plan_sha256)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          $linux = @($plan.selected_checks | Where-Object { @($_.platforms) -ccontains 'linux' }).Count -gt 0
          $windows = @($plan.selected_checks | Where-Object { @($_.platforms) -ccontains 'windows' }).Count -gt 0
          "linux=$($linux.ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "windows=$($windows.ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          Import-Module ./scripts/lib/MorphospaceAffectedValidation.psm1 -Force
          $registry = Get-Content -LiteralPath manifests/affected-validation-registry.json -Raw | ConvertFrom-Json -Depth 64
          foreach ($platform in @('linux','windows')) {
            $segments = @(Get-MorphospaceAffectedValidationSegments -Plan $plan -Registry $registry -Platform $platform)
            $include = if ($segments.Count -eq 0) { @([pscustomobject][ordered]@{segment_id="$platform-000";timeout_minutes=5}) } else { @($segments | ForEach-Object { $outer=[int][Math]::Ceiling(([long]$_.estimated_budget_seconds+900)/60.0);if($outer-ge360){throw 'Affected-validation segment plus bounded setup/cleanup overhead reaches the GitHub six-hour ceiling.'};[pscustomobject][ordered]@{segment_id=[string]$_.segment_id;timeout_minutes=$outer} }) }
            $matrix = [pscustomobject][ordered]@{include=@($include)}
            "${platform}_matrix=$(($matrix | ConvertTo-Json -Depth 4 -Compress))" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          }
          } catch {$planFailure=$_}
          if($null-ne$planFailure){$message=[string]$planFailure.Exception.Message;if($message.Length-gt2048){$message=$message.Substring(0,2048)};$diagnostic=[pscustomobject][ordered]@{schema='rusty.morphospace.diagnostic.affected_validation_pre_evidence_failure.v1';authority='non-authoritative-terminal-diagnostic';phase='plan';result='code-fail';failure=[pscustomobject][ordered]@{failure_kind='plan';exception_type=$planFailure.Exception.GetType().FullName;exception_message=$message};claims=[pscustomobject][ordered]@{typed_aggregate_evidence_produced=$false;acceptance_authority=$false;publication_authority=$false}};[byte[]]$bytes=[Text.UTF8Encoding]::new($false).GetBytes(($diagnostic|ConvertTo-Json -Depth 6 -Compress)+"`n");if($bytes.Length-gt65536){throw 'Bounded plan diagnostic exceeded 65536 bytes.'};$stream=[IO.File]::Open("$env:RUNNER_TEMP/affected-plan-diagnostic.json",[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None);try{$stream.Write($bytes,0,$bytes.Length)}finally{$stream.Dispose()};'diagnostic_ready=true'|Add-Content -LiteralPath $env:GITHUB_OUTPUT;throw $planFailure}
      - name: Preserve bounded plan diagnostic
        if: always() && steps.plan.outputs.diagnostic_ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: affected-plan-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/affected-plan-diagnostic.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve canonical-digest affected plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: affected-plan-${{ steps.plan.outputs.plan_sha256 }}
          path: ${{ runner.temp }}/affected-plan.json
          if-no-files-found: error
          retention-days: 7

  affected-linux-segments:
    name: segment-${{ matrix.segment_id }}
    needs: [infrastructure, select]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.select.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.linux_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore prior exact-check cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/affected-check-cache-${{ matrix.segment_id }}/current
          key: affected-check-${{ matrix.segment_id }}-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            affected-check-${{ matrix.segment_id }}-pr-${{ github.event.pull_request.number }}-
      - name: Run affected Linux segment
        id: execute
        shell: pwsh
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INFRA_RESULT: ${{ needs.infrastructure.result }}
          SELECT_RESULT: ${{ needs.select.result }}
          LINUX_SELECTED: ${{ needs.select.outputs.linux }}
          SEGMENT_ID: ${{ matrix.segment_id }}
        run: |
          if ($env:INFRA_RESULT -cne 'success' -or $env:SELECT_RESULT -cne 'success') { throw 'Required Linux selection prerequisites did not succeed.' }
          if ($env:LINUX_SELECTED -cnotin @('true','false')) { throw 'Required Linux selection output must be exactly true or false.' }
          ./scripts/Test-PowerShellHost.ps1 -SelfTest
          $base = if ($env:GITHUB_EVENT_NAME -ceq 'pull_request') { $env:PR_BASE } else { (git rev-parse HEAD^).Trim() }
          $head = if ($env:GITHUB_EVENT_NAME -ceq 'pull_request') { $env:PR_HEAD } else { $env:GITHUB_SHA }
          $tier = if ($env:GITHUB_EVENT_NAME -ceq 'pull_request') { 'Quick' } else { 'Deep' }
          if ((git rev-parse HEAD) -cne $head) { throw 'Checkout does not equal the event head SHA.' }
          ./scripts/Resolve-AffectedValidation.ps1 -RepositoryRoot . -BaseCommit $base -HeadCommit $head -Tier $tier -OutPath "$env:RUNNER_TEMP/affected-plan.json"
          $cacheRoot = Join-Path $env:RUNNER_TEMP "affected-check-cache-$env:SEGMENT_ID"
          $priorRoot = Join-Path $cacheRoot 'prior'
          $currentRoot = Join-Path $cacheRoot 'current'
          $evidencePath = Join-Path $env:RUNNER_TEMP "$env:SEGMENT_ID.json"
          $diagnosticPath = Join-Path $env:RUNNER_TEMP "pre-evidence-$env:SEGMENT_ID.json"
          if (Test-Path -LiteralPath $priorRoot) { Remove-Item -LiteralPath $priorRoot -Recurse -Force }
          if (Test-Path -LiteralPath $currentRoot) { Move-Item -LiteralPath $currentRoot -Destination $priorRoot }
          $failure = $null
          $cacheReady = $false
          $inventorySha256 = $null
          try {
            $execution = & ./scripts/Invoke-AffectedValidation.ps1 -RepositoryRoot . -BaseCommit $base -HeadCommit $head -PlanPath "$env:RUNNER_TEMP/affected-plan.json" -Platform linux -SegmentId $env:SEGMENT_ID -OutPath $evidencePath -CheckEvidenceDirectory $currentRoot -PriorEvidenceDirectory $priorRoot
            $inventorySha256 = [string]$execution.cache_inventory_sha256
            if ($inventorySha256 -notmatch '^[0-9a-f]{64}$') { throw 'Passing Linux executor did not return its exact finalized inventory SHA-256.' }
            $cacheReady = $true
          } catch {
            $failure = $_
            if ([string]$_.Exception.Data['AffectedCacheFinalized'] -ceq 'true') {
              $inventorySha256 = [string]$_.Exception.Data['AffectedInventorySha256']
              if ($inventorySha256 -notmatch '^[0-9a-f]{64}$') { throw 'Failing Linux executor did not bind its exact finalized inventory SHA-256.' }
              $cacheReady = $true
            }
          }
          if (Test-Path -LiteralPath $priorRoot) { Remove-Item -LiteralPath $priorRoot -Recurse -Force }
          if (-not (Test-Path -LiteralPath $evidencePath -PathType Leaf)) {
            $capturedExecutorFailure = $null -ne $failure
            if (-not $capturedExecutorFailure) {
              $failure = [Management.Automation.ErrorRecord]::new(
                [InvalidOperationException]::new('Affected Linux segment returned without producing typed evidence.'),
                'AffectedLinuxSegmentMissingEvidence',
                [Management.Automation.ErrorCategory]::InvalidResult,
                $env:SEGMENT_ID)
            }
            $bounded = {
              param([AllowNull()][object]$Value)
              $text = [string]$Value
              if ($text.Length -le 2048) { return $text }
              return $text.Substring(0,2048)
            }
            $innerException = $failure.Exception.InnerException
            $errorDetails = $failure.ErrorDetails
            $invocationInfo = $failure.InvocationInfo
            $diagnostic = [pscustomobject][ordered]@{
              schema='rusty.morphospace.diagnostic.affected_validation_pre_evidence_failure.v1'
              authority='non-authoritative-terminal-diagnostic'
              result='code-fail'
              repository=[string]$env:GITHUB_REPOSITORY
              event_name=[string]$env:GITHUB_EVENT_NAME
              run=[pscustomobject][ordered]@{id=[string]$env:GITHUB_RUN_ID;attempt=[string]$env:GITHUB_RUN_ATTEMPT;job=[string]$env:GITHUB_JOB}
              base_commit=$base
              head_commit=$head
              platform='linux'
              segment_id=[string]$env:SEGMENT_ID
              failure=[pscustomobject][ordered]@{
                captured_executor_exception=$capturedExecutorFailure
                fully_qualified_error_id=& $bounded $failure.FullyQualifiedErrorId
                category=& $bounded $failure.CategoryInfo
                exception_type=& $bounded $failure.Exception.GetType().FullName
                exception_message=& $bounded $failure.Exception.Message
                inner_exception_type=if ($null -eq $innerException) { '' } else { & $bounded $innerException.GetType().FullName }
                inner_exception_message=if ($null -eq $innerException) { '' } else { & $bounded $innerException.Message }
                error_details=if ($null -eq $errorDetails) { '' } else { & $bounded $errorDetails.Message }
                position_message=if ($null -eq $invocationInfo) { '' } else { & $bounded $invocationInfo.PositionMessage }
                script_stack_trace=& $bounded $failure.ScriptStackTrace
              }
              claims=[pscustomobject][ordered]@{typed_aggregate_evidence_produced=$false;reusable_cache_published=$false;acceptance_authority=$false;publication_authority=$false}
            }
            [byte[]]$diagnosticBytes = [Text.UTF8Encoding]::new($false).GetBytes(($diagnostic | ConvertTo-Json -Depth 8 -Compress) + "`n")
            if ($diagnosticBytes.Length -gt 65536) { $failure.Exception.Data['AffectedPreEvidenceDiagnosticFailure'] = 'Bounded diagnostic exceeded 65536 bytes.'; throw $failure }
            try {
              $diagnosticStream = [IO.File]::Open($diagnosticPath,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
              try { $diagnosticStream.Write($diagnosticBytes,0,$diagnosticBytes.Length) } finally { $diagnosticStream.Dispose() }
            } catch {
              $failure.Exception.Data['AffectedPreEvidenceDiagnosticFailure'] = [string]$_.Exception.Message
              throw $failure
            }
            "pre_evidence_failure=true" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
            throw $failure
          }
          "evidence_ready=true" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "evidence_sha256=$((Get-FileHash -LiteralPath $evidencePath -Algorithm SHA256).Hash.ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          if ($cacheReady) {
            $inventoryPath = Join-Path $currentRoot 'inventory.json'
            if (-not (Test-Path -LiteralPath $inventoryPath -PathType Leaf)) { throw 'Finalized Linux check cache lacks its parent-owned inventory.' }
            $actualInventorySha256 = (Get-FileHash -LiteralPath $inventoryPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualInventorySha256 -cne $inventorySha256) { throw 'Finalized Linux check cache inventory differs from the executor receipt.' }
            "cache_ready=true" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
            "inventory_sha256=$actualInventorySha256" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          }
          if ($null -ne $failure) { throw $failure }
          git diff --check $base $head; if ($LASTEXITCODE -ne 0) { throw 'Linux event delta has whitespace errors.' }
      - name: Preserve content-addressed Linux segment evidence
        if: always() && needs.select.outputs.linux == 'true' && steps.execute.outputs.evidence_ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: affected-segment-${{ matrix.segment_id }}-${{ steps.execute.outputs.evidence_sha256 }}
          path: ${{ runner.temp }}/${{ matrix.segment_id }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve bounded Linux pre-evidence failure diagnostic
        if: always() && needs.select.outputs.linux == 'true' && steps.execute.outputs.pre_evidence_failure == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: affected-pre-evidence-${{ matrix.segment_id }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pre-evidence-${{ matrix.segment_id }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve exact Linux check streams and receipts
        if: always() && needs.select.outputs.linux == 'true' && steps.execute.outputs.cache_ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: affected-checks-${{ matrix.segment_id }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/affected-check-cache-${{ matrix.segment_id }}/current
          if-no-files-found: error
          retention-days: 7
      - name: Save resumable Linux check cache
        if: always() && github.event_name == 'pull_request' && needs.select.outputs.linux == 'true' && steps.execute.outputs.cache_ready == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/affected-check-cache-${{ matrix.segment_id }}/current
          key: affected-check-${{ matrix.segment_id }}-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve resumable selector phase evidence
        if: always() && needs.select.outputs.linux == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: selector-phases-${{ matrix.segment_id }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/affected-selector-phases-*-${{ matrix.segment_id }}
          if-no-files-found: warn
          retention-days: 7

  quick-linux:
    needs: [infrastructure, select, affected-linux-segments]
    timeout-minutes: 20
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind required Linux segment results
        shell: pwsh
        env:
          INFRA_RESULT: ${{ needs.infrastructure.result }}
          SELECT_RESULT: ${{ needs.select.result }}
          SEGMENT_RESULT: ${{ needs.affected-linux-segments.result }}
          LINUX_SELECTED: ${{ needs.select.outputs.linux }}
        run: |
          if ($env:INFRA_RESULT -cne 'success' -or $env:SELECT_RESULT -cne 'success') { throw 'Required Linux selection prerequisites did not succeed.' }
          if ($env:LINUX_SELECTED -cnotin @('true','false')) { throw 'Required Linux selection output must be exactly true or false.' }
          if ($env:LINUX_SELECTED -ceq 'true' -and $env:SEGMENT_RESULT -cne 'success') { throw 'One or more required Linux segments did not succeed.' }
      - name: Download Linux segment evidence
        if: needs.select.outputs.linux == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: affected-segment-linux-*
          path: ${{ runner.temp }}/affected-linux-segments
          merge-multiple: true
      - name: Verify and merge exact Linux segment union
        if: needs.select.outputs.linux == 'true'
        id: merge
        shell: pwsh
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $base = if ($env:GITHUB_EVENT_NAME -ceq 'pull_request') { $env:PR_BASE } else { (git rev-parse HEAD^).Trim() }
          $head = if ($env:GITHUB_EVENT_NAME -ceq 'pull_request') { $env:PR_HEAD } else { $env:GITHUB_SHA }
          $tier = if ($env:GITHUB_EVENT_NAME -ceq 'pull_request') { 'Quick' } else { 'Deep' }
          ./scripts/Resolve-AffectedValidation.ps1 -RepositoryRoot . -BaseCommit $base -HeadCommit $head -Tier $tier -OutPath "$env:RUNNER_TEMP/affected-plan.json"
          ./scripts/Merge-AffectedValidationSegments.ps1 -RepositoryRoot . -BaseCommit $base -HeadCommit $head -PlanPath "$env:RUNNER_TEMP/affected-plan.json" -Platform linux -SegmentEvidenceDirectory "$env:RUNNER_TEMP/affected-linux-segments" -OutPath "$env:RUNNER_TEMP/affected-linux-evidence.json" | Out-Null
          "evidence_sha256=$((Get-FileHash -LiteralPath "$env:RUNNER_TEMP/affected-linux-evidence.json" -Algorithm SHA256).Hash.ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
      - name: Preserve content-addressed Linux evidence
        if: needs.select.outputs.linux == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: affected-linux-${{ steps.merge.outputs.evidence_sha256 }}
          path: ${{ runner.temp }}/affected-linux-evidence.json
          if-no-files-found: error
          retention-days: 7

  affected-windows-segments:
    name: segment-${{ matrix.segment_id }}
    needs: [infrastructure, select]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.select.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.windows_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore prior exact-check cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/affected-check-cache-${{ matrix.segment_id }}/current
          key: affected-check-${{ matrix.segment_id }}-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            affected-check-${{ matrix.segment_id }}-pr-${{ github.event.pull_request.number }}-
      - name: Run affected Windows segment
        id: execute
        shell: pwsh
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INFRA_RESULT: ${{ needs.infrastructure.result }}
          SELECT_RESULT: ${{ needs.select.result }}
          WINDOWS_SELECTED: ${{ needs.select.outputs.windows }}
          SEGMENT_ID: ${{ matrix.segment_id }}
        run: |
          if ($env:INFRA_RESULT -cne 'success' -or $env:SELECT_RESULT -cne 'success') { throw 'Required Windows selection prerequisites did not succeed.' }
          if ($env:WINDOWS_SELECTED -cnotin @('true','false')) { throw 'Required Windows selection output must be exactly true or false.' }
          ./scripts/Test-PowerShellHost.ps1 -SelfTest
          $base = if ($env:GITHUB_EVENT_NAME -ceq 'pull_request') { $env:PR_BASE } else { (git rev-parse HEAD^).Trim() }
          $head = if ($env:GITHUB_EVENT_NAME -ceq 'pull_request') { $env:PR_HEAD } else { $env:GITHUB_SHA }
          $tier = if ($env:GITHUB_EVENT_NAME -ceq 'pull_request') { 'Quick' } else { 'Deep' }
          if ((git rev-parse HEAD) -cne $head) { throw 'Checkout does not equal the event head SHA.' }
          ./scripts/Resolve-AffectedValidation.ps1 -RepositoryRoot . -BaseCommit $base -HeadCommit $head -Tier $tier -OutPath "$env:RUNNER_TEMP/affected-plan.json"
          $cacheRoot = Join-Path $env:RUNNER_TEMP "affected-check-cache-$env:SEGMENT_ID"
          $priorRoot = Join-Path $cacheRoot 'prior'
          $currentRoot = Join-Path $cacheRoot 'current'
          $evidencePath = Join-Path $env:RUNNER_TEMP "$env:SEGMENT_ID.json"
          $diagnosticPath = Join-Path $env:RUNNER_TEMP "pre-evidence-$env:SEGMENT_ID.json"
          if (Test-Path -LiteralPath $priorRoot) { Remove-Item -LiteralPath $priorRoot -Recurse -Force }
          if (Test-Path -LiteralPath $currentRoot) { Move-Item -LiteralPath $currentRoot -Destination $priorRoot }
          $failure = $null
          $cacheReady = $false
          $inventorySha256 = $null
          try {
            $execution = & ./scripts/Invoke-AffectedValidation.ps1 -RepositoryRoot . -BaseCommit $base -HeadCommit $head -PlanPath "$env:RUNNER_TEMP/affected-plan.json" -Platform windows -SegmentId $env:SEGMENT_ID -OutPath $evidencePath -CheckEvidenceDirectory $currentRoot -PriorEvidenceDirectory $priorRoot
            $inventorySha256 = [string]$execution.cache_inventory_sha256
            if ($inventorySha256 -notmatch '^[0-9a-f]{64}$') { throw 'Passing Windows executor did not return its exact finalized inventory SHA-256.' }
            $cacheReady = $true
          } catch {
            $failure = $_
            if ([string]$_.Exception.Data['AffectedCacheFinalized'] -ceq 'true') {
              $inventorySha256 = [string]$_.Exception.Data['AffectedInventorySha256']
              if ($inventorySha256 -notmatch '^[0-9a-f]{64}$') { throw 'Failing Windows executor did not bind its exact finalized inventory SHA-256.' }
              $cacheReady = $true
            }
          }
          if (Test-Path -LiteralPath $priorRoot) { Remove-Item -LiteralPath $priorRoot -Recurse -Force }
          if (-not (Test-Path -LiteralPath $evidencePath -PathType Leaf)) {
            $capturedExecutorFailure = $null -ne $failure
            if (-not $capturedExecutorFailure) {
              $failure = [Management.Automation.ErrorRecord]::new(
                [InvalidOperationException]::new('Affected Windows segment returned without producing typed evidence.'),
                'AffectedWindowsSegmentMissingEvidence',
                [Management.Automation.ErrorCategory]::InvalidResult,
                $env:SEGMENT_ID)
            }
            $bounded = {
              param([AllowNull()][object]$Value)
              $text = [string]$Value
              if ($text.Length -le 2048) { return $text }
              return $text.Substring(0,2048)
            }
            $innerException = $failure.Exception.InnerException
            $errorDetails = $failure.ErrorDetails
            $invocationInfo = $failure.InvocationInfo
            $diagnostic = [pscustomobject][ordered]@{
              schema='rusty.morphospace.diagnostic.affected_validation_pre_evidence_failure.v1'
              authority='non-authoritative-terminal-diagnostic'
              result='code-fail'
              repository=[string]$env:GITHUB_REPOSITORY
              event_name=[string]$env:GITHUB_EVENT_NAME
              run=[pscustomobject][ordered]@{id=[string]$env:GITHUB_RUN_ID;attempt=[string]$env:GITHUB_RUN_ATTEMPT;job=[string]$env:GITHUB_JOB}
              base_commit=$base
              head_commit=$head
              platform='windows'
              segment_id=[string]$env:SEGMENT_ID
              failure=[pscustomobject][ordered]@{
                captured_executor_exception=$capturedExecutorFailure
                fully_qualified_error_id=& $bounded $failure.FullyQualifiedErrorId
                category=& $bounded $failure.CategoryInfo
                exception_type=& $bounded $failure.Exception.GetType().FullName
                exception_message=& $bounded $failure.Exception.Message
                inner_exception_type=if ($null -eq $innerException) { '' } else { & $bounded $innerException.GetType().FullName }
                inner_exception_message=if ($null -eq $innerException) { '' } else { & $bounded $innerException.Message }
                error_details=if ($null -eq $errorDetails) { '' } else { & $bounded $errorDetails.Message }
                position_message=if ($null -eq $invocationInfo) { '' } else { & $bounded $invocationInfo.PositionMessage }
                script_stack_trace=& $bounded $failure.ScriptStackTrace
              }
              claims=[pscustomobject][ordered]@{typed_aggregate_evidence_produced=$false;reusable_cache_published=$false;acceptance_authority=$false;publication_authority=$false}
            }
            [byte[]]$diagnosticBytes = [Text.UTF8Encoding]::new($false).GetBytes(($diagnostic | ConvertTo-Json -Depth 8 -Compress) + "`n")
            if ($diagnosticBytes.Length -gt 65536) { $failure.Exception.Data['AffectedPreEvidenceDiagnosticFailure'] = 'Bounded diagnostic exceeded 65536 bytes.'; throw $failure }
            try {
              $diagnosticStream = [IO.File]::Open($diagnosticPath,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
              try { $diagnosticStream.Write($diagnosticBytes,0,$diagnosticBytes.Length) } finally { $diagnosticStream.Dispose() }
            } catch {
              $failure.Exception.Data['AffectedPreEvidenceDiagnosticFailure'] = [string]$_.Exception.Message
              throw $failure
            }
            "pre_evidence_failure=true" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
            throw $failure
          }
          "evidence_ready=true" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "evidence_sha256=$((Get-FileHash -LiteralPath $evidencePath -Algorithm SHA256).Hash.ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          if ($cacheReady) {
            $inventoryPath = Join-Path $currentRoot 'inventory.json'
            if (-not (Test-Path -LiteralPath $inventoryPath -PathType Leaf)) { throw 'Finalized Windows check cache lacks its parent-owned inventory.' }
            $actualInventorySha256 = (Get-FileHash -LiteralPath $inventoryPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualInventorySha256 -cne $inventorySha256) { throw 'Finalized Windows check cache inventory differs from the executor receipt.' }
            "cache_ready=true" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
            "inventory_sha256=$actualInventorySha256" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          }
          if ($null -ne $failure) { throw $failure }
          git diff --check $base $head; if ($LASTEXITCODE -ne 0) { throw 'Windows event delta has whitespace errors.' }
      - name: Preserve content-addressed Windows segment evidence
        if: always() && needs.select.outputs.windows == 'true' && steps.execute.outputs.evidence_ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: affected-segment-${{ matrix.segment_id }}-${{ steps.execute.outputs.evidence_sha256 }}
          path: ${{ runner.temp }}/${{ matrix.segment_id }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve bounded Windows pre-evidence failure diagnostic
        if: always() && needs.select.outputs.windows == 'true' && steps.execute.outputs.pre_evidence_failure == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: affected-pre-evidence-${{ matrix.segment_id }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pre-evidence-${{ matrix.segment_id }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve exact Windows check streams and receipts
        if: always() && needs.select.outputs.windows == 'true' && steps.execute.outputs.cache_ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: affected-checks-${{ matrix.segment_id }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/affected-check-cache-${{ matrix.segment_id }}/current
          if-no-files-found: error
          retention-days: 7
      - name: Save resumable Windows check cache
        if: always() && github.event_name == 'pull_request' && needs.select.outputs.windows == 'true' && steps.execute.outputs.cache_ready == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/affected-check-cache-${{ matrix.segment_id }}/current
          key: affected-check-${{ matrix.segment_id }}-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}

  standard-windows:
    needs: [infrastructure, select, affected-windows-segments]
    timeout-minutes: 20
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind required Windows segment results
        shell: pwsh
        env:
          INFRA_RESULT: ${{ needs.infrastructure.result }}
          SELECT_RESULT: ${{ needs.select.result }}
          SEGMENT_RESULT: ${{ needs.affected-windows-segments.result }}
          WINDOWS_SELECTED: ${{ needs.select.outputs.windows }}
        run: |
          if ($env:INFRA_RESULT -cne 'success' -or $env:SELECT_RESULT -cne 'success') { throw 'Required Windows selection prerequisites did not succeed.' }
          if ($env:WINDOWS_SELECTED -cnotin @('true','false')) { throw 'Required Windows selection output must be exactly true or false.' }
          if ($env:WINDOWS_SELECTED -ceq 'true' -and $env:SEGMENT_RESULT -cne 'success') { throw 'One or more required Windows segments did not succeed.' }
      - name: Download Windows segment evidence
        if: needs.select.outputs.windows == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: affected-segment-windows-*
          path: ${{ runner.temp }}/affected-windows-segments
          merge-multiple: true
      - name: Verify and merge exact Windows segment union
        if: needs.select.outputs.windows == 'true'
        id: merge
        shell: pwsh
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $base = if ($env:GITHUB_EVENT_NAME -ceq 'pull_request') { $env:PR_BASE } else { (git rev-parse HEAD^).Trim() }
          $head = if ($env:GITHUB_EVENT_NAME -ceq 'pull_request') { $env:PR_HEAD } else { $env:GITHUB_SHA }
          $tier = if ($env:GITHUB_EVENT_NAME -ceq 'pull_request') { 'Quick' } else { 'Deep' }
          ./scripts/Resolve-AffectedValidation.ps1 -RepositoryRoot . -BaseCommit $base -HeadCommit $head -Tier $tier -OutPath "$env:RUNNER_TEMP/affected-plan.json"
          ./scripts/Merge-AffectedValidationSegments.ps1 -RepositoryRoot . -BaseCommit $base -HeadCommit $head -PlanPath "$env:RUNNER_TEMP/affected-plan.json" -Platform windows -SegmentEvidenceDirectory "$env:RUNNER_TEMP/affected-windows-segments" -OutPath "$env:RUNNER_TEMP/affected-windows-evidence.json" | Out-Null
          "evidence_sha256=$((Get-FileHash -LiteralPath "$env:RUNNER_TEMP/affected-windows-evidence.json" -Algorithm SHA256).Hash.ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
      - name: Preserve content-addressed Windows evidence
        if: needs.select.outputs.windows == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: affected-windows-${{ steps.merge.outputs.evidence_sha256 }}
          path: ${{ runner.temp }}/affected-windows-evidence.json
          if-no-files-found: error
          retention-days: 7

  quick-windows:
    needs: [infrastructure, select, standard-windows]
    timeout-minutes: 10
    if: always() && github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Bind required Windows Quick context to the exact selected result
        shell: pwsh
        env:
          INFRA_RESULT: ${{ needs.infrastructure.result }}
          SELECT_RESULT: ${{ needs.select.result }}
          STANDARD_RESULT: ${{ needs.standard-windows.result }}
        run: |
          if ($env:INFRA_RESULT -cne 'success' -or $env:SELECT_RESULT -cne 'success' -or $env:STANDARD_RESULT -cne 'success') { throw 'Required Windows Quick compatibility prerequisites did not succeed.' }
          # standard-windows owns the exact selected Windows commands. This retained
          # required context only binds their result and never replays an unaffected suite.
          Write-Host 'The required quick-windows context is bound to the successful selected Windows result.'

  post-merge-attestation:
    if: github.event_name == 'push'
    needs: select
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      execution_mode: ${{ steps.attest.outputs.execution_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Authenticate exact-tree reuse or require current delta
        id: attest
        shell: pwsh
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $executionMode = 'current-delta'
          try {
            $topology = ./scripts/Test-AffectedValidationTopology.ps1 -RepositoryRoot . -BeforeCommit $env:PUSH_BEFORE -HeadCommit $env:GITHUB_SHA
            if ($topology.mode -ceq 'exact-tree-premerge-reuse') {
              $candidate = $topology.candidate.commit
              $pulls = gh api "/repos/$env:GITHUB_REPOSITORY/commits/$candidate/pulls" | ConvertFrom-Json -Depth 64
              $pull = @($pulls | Where-Object { $_.merged_at -and $_.merge_commit_sha -ceq $env:GITHUB_SHA -and $_.head.sha -ceq $candidate }) | Select-Object -First 1
              if ($null -eq $pull) { throw 'No merged PR binds the candidate event head to this merge commit.' }
              $runs = (gh api "/repos/$env:GITHUB_REPOSITORY/actions/runs?head_sha=$candidate&event=pull_request&per_page=100" | ConvertFrom-Json -Depth 64).workflow_runs
              $run = @($runs | Where-Object { $_.name -ceq 'validate' -and $_.event -ceq 'pull_request' -and $_.head_sha -ceq $candidate -and $_.status -ceq 'completed' -and $_.conclusion -ceq 'success' } | Sort-Object created_at -Descending | Select-Object -First 1)
              if ($null -eq $run) { throw 'No successful candidate PR validate run is available for reuse.' }
              $workflowPath = '.github/workflows/validate.yml'
              if ([string]$run.path -cne $workflowPath) { throw 'Candidate run is not bound to the exact validate workflow path.' }
              $jobs = (gh api "/repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)/jobs?per_page=100" | ConvertFrom-Json -Depth 64).jobs
              $remoteArtifacts = (gh api "/repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)/artifacts?per_page=100" | ConvertFrom-Json -Depth 64).artifacts
              $artifactRoot = Join-Path $env:RUNNER_TEMP 'premerge-artifacts'; [IO.Directory]::CreateDirectory($artifactRoot) | Out-Null
              $bound = [Collections.Generic.List[object]]::new()
              foreach ($remote in @($remoteArtifacts | Where-Object { $_.name -match '^affected-(?:plan|linux|windows)-' })) {
                $kind = if ($remote.name -match '^affected-plan-[0-9a-f]{64}$') { 'plan' } elseif ($remote.name -match '^affected-linux-[0-9a-f]{64}$') { 'linux' } elseif ($remote.name -match '^affected-windows-[0-9a-f]{64}$') { 'windows' } else { throw "Unexpected affected-validation artifact name '$($remote.name)'." }
                $fileName = if ($kind -ceq 'plan') { 'affected-plan.json' } else { "affected-$kind-evidence.json" }
                $zip = Join-Path $artifactRoot ("$($remote.id).zip")
                Invoke-WebRequest -Uri ([string]$remote.archive_download_url) -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } -OutFile $zip
                $zipBytes = [IO.File]::ReadAllBytes($zip)
                if ($zipBytes.Length -lt 4 -or $zipBytes[0] -ne 0x50 -or $zipBytes[1] -ne 0x4b) { throw "Artifact '$($remote.name)' download is not a ZIP byte stream." }
                $archive = [IO.Compression.ZipFile]::OpenRead($zip)
                try {
                  $entries = @($archive.Entries | Where-Object { $_.FullName -ceq $fileName })
                  if ($entries.Count -ne 1 -or @($archive.Entries | Where-Object { -not $_.FullName.EndsWith('/') }).Count -ne 1) { throw "Artifact '$($remote.name)' has an unexpected payload inventory." }
                  $target = Join-Path $artifactRoot $fileName
                  if ([IO.File]::Exists($target)) { throw "Duplicate evidence file '$fileName' in PR artifacts." }
                  $input = $entries[0].Open(); $output = [IO.File]::Open($target, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write)
                  try { $input.CopyTo($output) } finally { $output.Dispose(); $input.Dispose() }
                } finally { $archive.Dispose() }
                $bound.Add([pscustomobject][ordered]@{id=[long]$remote.id;remote_name=[string]$remote.name;name=$fileName;platform=$kind;sha256=(Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant();size=[long](Get-Item -LiteralPath $target).Length;expires_utc=[string]$remote.expires_at})
              }
              $planFile = Join-Path $artifactRoot 'affected-plan.json'; if (-not [IO.File]::Exists($planFile)) { throw 'PR artifacts do not contain the plan.' }
              $plan = Get-Content -LiteralPath $planFile -Raw | ConvertFrom-Json -Depth 64
              $registry = Get-Content -LiteralPath manifests/affected-validation-registry.json -Raw | ConvertFrom-Json -Depth 64
              $checkMap = @{}; foreach ($check in @($registry.checks)) { $checkMap[[string]$check.check_id] = $check }
              $coverage = [Collections.Generic.List[object]]::new()
              foreach ($platform in @('linux','windows')) { foreach ($selected in @($plan.selected_checks | Where-Object { @($_.platforms) -ccontains $platform })) { $check = $checkMap[[string]$selected.check_id]; if ($null -eq $check) { throw "Plan selects unknown check '$($selected.check_id)'." }; $commandPath = [string]$check.command_path; $commandBlob = (git rev-parse "${candidate}:$commandPath").Trim(); if ($LASTEXITCODE -ne 0 -or $commandBlob -notmatch '^[0-9a-f]{40}$') { throw "Candidate command is not an exact Git blob: $commandPath" }; $coverage.Add([pscustomobject][ordered]@{platform=$platform;check_id=[string]$selected.check_id;command_path=$commandPath;command_blob_sha1=$commandBlob}) } }
              $workflowBlob = (git rev-parse "${candidate}:$workflowPath").Trim(); if ($LASTEXITCODE -ne 0 -or $workflowBlob -notmatch '^[0-9a-f]{40}$') { throw 'Candidate validate workflow is not an exact Git blob.' }
              $receipt = [pscustomobject][ordered]@{
                schema='rusty.morphospace.workflow.affected_validation_reuse.v1'; repository=$env:GITHUB_REPOSITORY
                event=[pscustomobject][ordered]@{name='pull_request';head_sha=[string]$pull.head.sha;base_sha=[string]$pull.base.sha}
                pull_request=[pscustomobject][ordered]@{number=[long]$pull.number;head_sha=[string]$pull.head.sha;base_sha=[string]$pull.base.sha}
                run=[pscustomobject][ordered]@{id=[long]$run.id;attempt=[long]$run.run_attempt;event=[string]$run.event;head_sha=[string]$run.head_sha;workflow_id=[long]$run.workflow_id;check_names=@($jobs | Where-Object { $_.conclusion -ceq 'success' } | ForEach-Object name | Sort-Object -Unique)}
                base=$plan.base;head=$plan.head;tree=$topology.candidate.tree
                workflow=[pscustomobject][ordered]@{id=[long]$run.workflow_id;path=$workflowPath;blob_sha1=$workflowBlob}
                plan=[pscustomobject][ordered]@{artifact_name="affected-plan-$($plan.plan_sha256)";file_sha256=(Get-FileHash -LiteralPath $planFile -Algorithm SHA256).Hash.ToLowerInvariant();canonical_sha256=[string]$plan.plan_sha256}
                artifacts=@($bound.ToArray());coverage=@($coverage.ToArray());freshness=[pscustomobject][ordered]@{created_utc=[string]$run.updated_at;max_age_minutes=1440}
                claims=[pscustomobject][ordered]@{historical_aggregate_reused=$false;acceptance_authority=$false;publication_authority=$false}
              }
              $receiptPath = Join-Path $artifactRoot 'reuse.json'; [IO.File]::WriteAllText($receiptPath,($receipt | ConvertTo-Json -Depth 64 -Compress)+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
              ./scripts/Test-AffectedValidationReuse.ps1 -RepositoryRoot . -BeforeCommit $env:PUSH_BEFORE -HeadCommit $env:GITHUB_SHA -ReusePath $receiptPath -ArtifactDirectory $artifactRoot | Out-Null
              $executionMode = 'authenticated-reuse'
            }
          } catch { Write-Warning "Pre-merge evidence is unavailable or unauthenticated; current push deltas remain required. $($_.Exception.Message)" }
          "execution_mode=$executionMode" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          git diff --check "$env:PUSH_BEFORE" "$env:GITHUB_SHA"; if ($LASTEXITCODE -ne 0) { throw 'Push delta has whitespace errors.' }

  main-linux-segments:
    name: main-segment-${{ matrix.segment_id }}
    if: github.event_name == 'push' && needs.select.outputs.linux == 'true' && needs.post-merge-attestation.outputs.execution_mode == 'current-delta'
    needs: [select, post-merge-attestation]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.linux_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - name: Run current Linux delta segment
        id: execute
        shell: pwsh
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          SEGMENT_ID: ${{ matrix.segment_id }}
        run: |
          $evidencePath = Join-Path $env:RUNNER_TEMP "$env:SEGMENT_ID.json";$failure=$null
          try { ./scripts/Resolve-AffectedValidation.ps1 -RepositoryRoot . -BaseCommit $env:PUSH_BEFORE -HeadCommit $env:GITHUB_SHA -OutPath "$env:RUNNER_TEMP/affected-plan.json"; ./scripts/Invoke-AffectedValidation.ps1 -RepositoryRoot . -BaseCommit $env:PUSH_BEFORE -HeadCommit $env:GITHUB_SHA -PlanPath "$env:RUNNER_TEMP/affected-plan.json" -Platform linux -SegmentId $env:SEGMENT_ID -OutPath $evidencePath | Out-Null } catch {$failure=$_}
          if($null-ne$failure-and-not(Test-Path -LiteralPath $evidencePath -PathType Leaf)){$message=[string]$failure.Exception.Message;if($message.Length-gt2048){$message=$message.Substring(0,2048)};$diagnostic=[pscustomobject][ordered]@{schema='rusty.morphospace.diagnostic.affected_validation_pre_evidence_failure.v1';authority='non-authoritative-terminal-diagnostic';phase='main-fallback';result='code-fail';platform='linux';segment_id=$env:SEGMENT_ID;failure=[pscustomobject][ordered]@{failure_kind='pre-evidence';exception_type=$failure.Exception.GetType().FullName;exception_message=$message};claims=[pscustomobject][ordered]@{typed_aggregate_evidence_produced=$false;acceptance_authority=$false;publication_authority=$false}};[byte[]]$bytes=[Text.UTF8Encoding]::new($false).GetBytes(($diagnostic|ConvertTo-Json -Depth 6 -Compress)+"`n");if($bytes.Length-gt65536){throw 'Bounded main fallback diagnostic exceeded 65536 bytes.'};$path="$env:RUNNER_TEMP/main-fallback-$env:SEGMENT_ID.json";$stream=[IO.File]::Open($path,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None);try{$stream.Write($bytes,0,$bytes.Length)}finally{$stream.Dispose()};'pre_evidence_failure=true'|Add-Content -LiteralPath $env:GITHUB_OUTPUT}
          if($null-ne$failure){if(Test-Path -LiteralPath $evidencePath -PathType Leaf){"evidence_sha256=$((Get-FileHash -LiteralPath $evidencePath -Algorithm SHA256).Hash.ToLowerInvariant())"|Add-Content -LiteralPath $env:GITHUB_OUTPUT};throw $failure}
          "evidence_sha256=$((Get-FileHash -LiteralPath $evidencePath -Algorithm SHA256).Hash.ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
      - name: Preserve bounded current Linux fallback diagnostic
        if: always() && steps.execute.outputs.pre_evidence_failure == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: main-fallback-${{ matrix.segment_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/main-fallback-${{ matrix.segment_id }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve current Linux delta segment
        if: always() && steps.execute.outputs.evidence_sha256 != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: affected-segment-${{ matrix.segment_id }}-${{ steps.execute.outputs.evidence_sha256 }}
          path: ${{ runner.temp }}/${{ matrix.segment_id }}.json
          if-no-files-found: error
          retention-days: 7

  main-windows-segments:
    name: main-segment-${{ matrix.segment_id }}
    if: github.event_name == 'push' && needs.select.outputs.windows == 'true' && needs.post-merge-attestation.outputs.execution_mode == 'current-delta'
    needs: [select, post-merge-attestation]
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.windows_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - name: Run current Windows delta segment
        id: execute
        shell: pwsh
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          SEGMENT_ID: ${{ matrix.segment_id }}
        run: |
          $evidencePath = Join-Path $env:RUNNER_TEMP "$env:SEGMENT_ID.json";$failure=$null
          try { ./scripts/Resolve-AffectedValidation.ps1 -RepositoryRoot . -BaseCommit $env:PUSH_BEFORE -HeadCommit $env:GITHUB_SHA -OutPath "$env:RUNNER_TEMP/affected-plan.json"; ./scripts/Invoke-AffectedValidation.ps1 -RepositoryRoot . -BaseCommit $env:PUSH_BEFORE -HeadCommit $env:GITHUB_SHA -PlanPath "$env:RUNNER_TEMP/affected-plan.json" -Platform windows -SegmentId $env:SEGMENT_ID -OutPath $evidencePath | Out-Null } catch {$failure=$_}
          if($null-ne$failure-and-not(Test-Path -LiteralPath $evidencePath -PathType Leaf)){$message=[string]$failure.Exception.Message;if($message.Length-gt2048){$message=$message.Substring(0,2048)};$diagnostic=[pscustomobject][ordered]@{schema='rusty.morphospace.diagnostic.affected_validation_pre_evidence_failure.v1';authority='non-authoritative-terminal-diagnostic';phase='main-fallback';result='code-fail';platform='windows';segment_id=$env:SEGMENT_ID;failure=[pscustomobject][ordered]@{failure_kind='pre-evidence';exception_type=$failure.Exception.GetType().FullName;exception_message=$message};claims=[pscustomobject][ordered]@{typed_aggregate_evidence_produced=$false;acceptance_authority=$false;publication_authority=$false}};[byte[]]$bytes=[Text.UTF8Encoding]::new($false).GetBytes(($diagnostic|ConvertTo-Json -Depth 6 -Compress)+"`n");if($bytes.Length-gt65536){throw 'Bounded main fallback diagnostic exceeded 65536 bytes.'};$path="$env:RUNNER_TEMP/main-fallback-$env:SEGMENT_ID.json";$stream=[IO.File]::Open($path,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None);try{$stream.Write($bytes,0,$bytes.Length)}finally{$stream.Dispose()};'pre_evidence_failure=true'|Add-Content -LiteralPath $env:GITHUB_OUTPUT}
          if($null-ne$failure){if(Test-Path -LiteralPath $evidencePath -PathType Leaf){"evidence_sha256=$((Get-FileHash -LiteralPath $evidencePath -Algorithm SHA256).Hash.ToLowerInvariant())"|Add-Content -LiteralPath $env:GITHUB_OUTPUT};throw $failure}
          "evidence_sha256=$((Get-FileHash -LiteralPath $evidencePath -Algorithm SHA256).Hash.ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
      - name: Preserve bounded current Windows fallback diagnostic
        if: always() && steps.execute.outputs.pre_evidence_failure == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: main-fallback-${{ matrix.segment_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/main-fallback-${{ matrix.segment_id }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve current Windows delta segment
        if: always() && steps.execute.outputs.evidence_sha256 != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: affected-segment-${{ matrix.segment_id }}-${{ steps.execute.outputs.evidence_sha256 }}
          path: ${{ runner.temp }}/${{ matrix.segment_id }}.json
          if-no-files-found: error
          retention-days: 7

  main-linux-delta:
    if: github.event_name == 'push' && needs.select.outputs.linux == 'true' && needs.post-merge-attestation.outputs.execution_mode == 'current-delta'
    needs: [select, post-merge-attestation, main-linux-segments]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - name: Download current Linux delta segment evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: affected-segment-linux-*
          path: ${{ runner.temp }}/affected-linux-segments
          merge-multiple: true
      - name: Verify current Linux delta segment union
        shell: pwsh
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          ./scripts/Resolve-AffectedValidation.ps1 -RepositoryRoot . -BaseCommit $env:PUSH_BEFORE -HeadCommit $env:GITHUB_SHA -OutPath "$env:RUNNER_TEMP/affected-plan.json"
          ./scripts/Merge-AffectedValidationSegments.ps1 -RepositoryRoot . -BaseCommit $env:PUSH_BEFORE -HeadCommit $env:GITHUB_SHA -PlanPath "$env:RUNNER_TEMP/affected-plan.json" -Platform linux -SegmentEvidenceDirectory "$env:RUNNER_TEMP/affected-linux-segments" -OutPath "$env:RUNNER_TEMP/affected-linux-evidence.json" | Out-Null

  main-windows-delta:
    if: github.event_name == 'push' && needs.select.outputs.windows == 'true' && needs.post-merge-attestation.outputs.execution_mode == 'current-delta'
    needs: [select, post-merge-attestation, main-windows-segments]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - name: Download current Windows delta segment evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: affected-segment-windows-*
          path: ${{ runner.temp }}/affected-windows-segments
          merge-multiple: true
      - name: Verify current Windows delta segment union
        shell: pwsh
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          ./scripts/Resolve-AffectedValidation.ps1 -RepositoryRoot . -BaseCommit $env:PUSH_BEFORE -HeadCommit $env:GITHUB_SHA -OutPath "$env:RUNNER_TEMP/affected-plan.json"
          ./scripts/Merge-AffectedValidationSegments.ps1 -RepositoryRoot . -BaseCommit $env:PUSH_BEFORE -HeadCommit $env:GITHUB_SHA -PlanPath "$env:RUNNER_TEMP/affected-plan.json" -Platform windows -SegmentEvidenceDirectory "$env:RUNNER_TEMP/affected-windows-segments" -OutPath "$env:RUNNER_TEMP/affected-windows-evidence.json" | Out-Null

  deep:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [infrastructure, select, quick-linux, standard-windows]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Bind full-history segmented Deep evidence without reusable baseline
        shell: pwsh
        env:
          INFRA_RESULT: ${{ needs.infrastructure.result }}
          SELECT_RESULT: ${{ needs.select.result }}
          LINUX_RESULT: ${{ needs.quick-linux.result }}
          WINDOWS_RESULT: ${{ needs.standard-windows.result }}
        run: |
          $aggregate = Get-Content -LiteralPath manifests/affected-validation-registry.json -Raw | ConvertFrom-Json -Depth 16
          if ($aggregate.historical_aggregate.tier -cne 'deep' -or [bool]$aggregate.historical_aggregate.reusable_evidence -or -not [bool]$aggregate.historical_aggregate.full_history_required) { throw 'Deep requires the typed no-reuse full-history aggregate policy.' }
          $shallow = git rev-parse --is-shallow-repository; if ($LASTEXITCODE -ne 0 -or $shallow.Trim() -cne 'false') { throw 'Deep requires a complete Git history.' }
          if ($env:INFRA_RESULT -cne 'success' -or $env:SELECT_RESULT -cne 'success' -or $env:LINUX_RESULT -cne 'success' -or $env:WINDOWS_RESULT -cne 'success') { throw 'Segmented Deep did not retain passing Linux and Windows platform evidence.' }
          Write-Host 'The complete independent-leaf Deep plan passed through exact non-overlapping platform segments.'
