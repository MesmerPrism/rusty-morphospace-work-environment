name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Ensure ripgrep
        shell: pwsh
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            choco install ripgrep -y --no-progress
          }
      - name: Quick portable validation
        shell: pwsh
        run: |
          ./scripts/Test-PowerShellHost.ps1 -SelfTest
          ./scripts/Test-WorkEnvironment.ps1 -SelfTest -Tier Quick
          git diff --check

  quick-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Ensure ripgrep
        shell: pwsh
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            sudo apt-get update
            sudo apt-get install -y ripgrep
          }
      - name: Quick portable validation
        shell: pwsh
        run: |
          ./scripts/Test-PowerShellHost.ps1 -SelfTest
          ./scripts/Test-WorkEnvironment.ps1 -SelfTest -Tier Quick
          git diff --check

  standard-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Ensure ripgrep
        shell: pwsh
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            choco install ripgrep -y --no-progress
          }
      - name: Standard portable validation
        shell: pwsh
        run: |
          ./scripts/Test-PowerShellHost.ps1
          ./scripts/Test-WorkEnvironment.ps1 -SelfTest -Tier Standard

  deep:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Ensure ripgrep
        shell: pwsh
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            choco install ripgrep -y --no-progress
          }
      - name: Deep authority validation
        shell: pwsh
        run: |
          ./scripts/Test-PowerShellHost.ps1
          ./scripts/Test-WorkEnvironment.ps1 -SelfTest -Tier Deep
